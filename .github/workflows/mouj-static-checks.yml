name: Mouj static checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "mouj-security-audit-*"]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none

      - name: PHP syntax checks
        run: |
          php -l api.php
          php -l config.php

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          html = Path("mouj-messenger-fcm.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script\s*>", html, re.I)
          if not scripts:
              raise SystemExit("No inline script blocks found")
          failures = []
          for i, script in enumerate(scripts, 1):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as f:
                  f.write(script)
                  name = f.name
              result = subprocess.run(["node", "--check", name], text=True, capture_output=True)
              Path(name).unlink(missing_ok=True)
              if result.returncode:
                  failures.append(f"Inline script {i}:\n{result.stderr}")
          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print(f"Syntax OK: checked {len(scripts)} inline script blocks")
          PY
